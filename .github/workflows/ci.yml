name: Backend CI

on:
  push:
    branches: [ "dev", "main" ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ "dev", "main" ]
    paths:
      - 'backend/**'

permissions:
  contents: read      
  checks: write       
  pull-requests: write 

jobs:
  build-shared:
    name: Build & Test Shared Libs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and Test Shared
        run: ./gradlew :shared:build


  build-microservices:
    name: Build ${{ matrix.service }}
    needs: build-shared
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway-service
          - identity-service
          - messenger-service

    defaults:
      run:
        working-directory: ./backend 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Checkstyle
        run: ./gradlew :${{ matrix.service }}:checkstyleMain
        continue-on-error: true

      - name: Publish Checkstyle Report
        uses: jwgmeligmeyling/checkstyle-github-action@v1
        with:
          path: 'backend/${{ matrix.service }}/build/reports/checkstyle/main.xml'
          token: ${{ secrets.GITHUB_TOKEN }}
          name: Checkstyle - ${{ matrix.service }}

      - name: Build project (without tests)
        run: ./gradlew :${{ matrix.service }}:build -x test

      - name: Run tests
        run: ./gradlew :${{ matrix.service }}:test
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Upload Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.service }}
          path: |
            backend/${{ matrix.service }}/build/reports/tests/
            backend/${{ matrix.service }}/build/reports/checkstyle/