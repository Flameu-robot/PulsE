name: Identity Service CI

on:
  push:
    branches: [ "dev", "feature/identity-service" ]
    paths:
      - 'backend/identity-service/**'
      - 'backend/shared/**'        
      - 'backend/config/**'
      - 'backend/gradle/**'
      - 'backend/build.gradle.kts'
      - 'backend/settings.gradle.kts'

permissions:
  contents: read      
  checks: write       
  pull-requests: write 

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./backend 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
          cache-dependency-path: backend/gradle/libs.versions.toml

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Checkstyle
        run: ./gradlew :identity-service:checkstyleMain
        continue-on-error: true

      - name: Publish Checkstyle Report
        uses: jwgmeligmeyling/checkstyle-github-action@v1
        with:
          path: 'backend/identity-service/build/reports/checkstyle/main.xml'
          token: ${{ secrets.GITHUB_TOKEN }}
          name: Checkstyle Annotations

      - name: Build project
        run: ./gradlew :identity-service:build -x test

      - name: Run tests
        run: ./gradlew :identity-service:test
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Upload Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-identity-service
          path: |
            backend/identity-service/build/reports/tests/
            backend/identity-service/build/reports/checkstyle/