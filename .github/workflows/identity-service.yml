name: Identity Service CI

on:
  push:
    branches: [ "dev", "feature/identity-service" ]
    paths:
      - 'backend/identity-service/**'
      - 'backend/config/checkstyle/**'
      - '.github/workflows/identity-service.yml'
  pull_request:
    branches: [ "dev", "feature/identity-service" ]
    paths:
      - 'backend/identity-service/**'

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
          cache-dependency-path: backend/gradle/libs.versions.toml

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Checkstyle
        run: ./gradlew :identity-service:checkstyleMain :identity-service:checkstyleTest

      - name: Build project
        run: ./gradlew :identity-service:build -x test

      - name: Run tests
        run: ./gradlew :identity-service:test
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Upload Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-identity-service
          path: |
            backend/identity-service/build/reports/tests/
            backend/identity-service/build/reports/checkstyle/