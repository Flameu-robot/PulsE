spring:
  application:
    name: pulse-gateway
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

          routes:

            # feed-service: /api/users/{id}/posts
            - id: feed-service-user-posts
              uri: ${FEED_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/users/*/posts
              filters:
                - StripPrefix=0

            # feed-service: подписки пользователей
            - id: feed-service-follow
              uri: ${FEED_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/users/*/follow,/api/users/*/follow/**,/api/users/*/followers,/api/users/*/following
              filters:
                - StripPrefix=0

            # feed-service: /api/groups/{id}/posts
            - id: feed-service-group-posts
              uri: ${FEED_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/groups/*/posts
              filters:
                - StripPrefix=0

            # feed-service: основные маршруты
            - id: feed-service
              uri: ${FEED_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/posts/**,/api/feed/**,/api/bookmarks/**,/api/comments/**
              filters:
                - StripPrefix=0

            # feed-service: документация
            - id: feed-service-docs
              uri: ${FEED_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/v3/api-docs/feed-service
              filters:
                - RewritePath=/v3/api-docs/feed-service, /v3/api-docs

            # identity-service: аутентификация и пользователи
            - id: identity-service
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**,/api/users/**
              filters:
                - StripPrefix=0

            # identity-service: документация
            - id: identity-service-docs
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/v3/api-docs/identity-service
              filters:
                - RewritePath=/v3/api-docs/identity-service, /v3/api-docs

            # messenger-service: сообщения и группы
            - id: messenger-service
              uri: ${MESSENGER_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/messages/**,/api/group/**
              filters:
                - StripPrefix=0

            # messenger-service: документация
            - id: messenger-service-docs
              uri: ${MESSENGER_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/v3/api-docs/messenger-service
              filters:
                - RewritePath=/v3/api-docs/messenger-service, /v3/api-docs

jwt:
  secret: ${JWT_SECRET:dev-super-secret-key-that-is-at-least-256-bits-long-for-hmac-sha256-algorithm}

internal:
  security:
    token: ${INTERNAL_SECRET:super-safe-dev-key}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
    gateway:
      access: unrestricted

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG