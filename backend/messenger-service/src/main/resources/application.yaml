spring:
  application:
    name: messenger-service

  profiles:
    active: dev
    include:
      - local

  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 25
        order_inserts: true
        order_updates: true
        hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations:
      - classpath:db/migration

  jackson:
    date-format: "yyyy-MM-dd'T'HH:mm:ss.SSSZ"
    default-property-inclusion: non_null
    time-zone: UTC
    deserialization:
      fail-on-unknown-properties: false

  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    consumer:
      group-id: messenger-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.pulse.*"

  data:
    redis:
      timeout: 2000
      lettuce:
        pool:
          max-active: 8
          max-idle: 4

  security:
    oauth2:
      resourceserver:
        jwt:
          # ?????? ?? Identity Service ??? ???????? ???????
          issuer-uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}

server:
  port: 8082
  shutdown: graceful

gateway:
  security:
    header-name: "${INTERNAL_HEADER:X-PulsE-Internal-Token}"

app:
  gateway:
    url: ${GATEWAY_URL:http://localhost:8000}
  kafka:
    topics:
      message-sent: message.sent
      media-uploaded: media.uploaded
      user-banned: user.banned # ?????, ??????? ?? ??????? ?? Identity
  minio:
    bucket: "messenger-attachments"
    endpoint: ${MINIO_URL:http://localhost:9000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true