spring:
  datasource:
    url: jdbc:tc:postgresql:17-alpine:///identity_test_db
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations:
      - classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092

  autoconfigure:
    exclude:
      - org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration

  mail:
    host: localhost
    port: 1025

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-id
            client-secret: test-google-secret
          github:
            client-id: test-github-id
            client-secret: test-github-secret

jwt:
  secret: test-super-secret-key-that-is-at-least-256-bits-long-for-hmac-sha256-algorithm
  issuer: pulse-identity-test
  access-token:
    expiration: 900000
  refresh-token:
    expiration: 2592000000

app:
  oauth2:
    authorized-redirect-uris:
      - http://localhost:3000/oauth2/redirect
    default-redirect-uri: http://localhost:3000/oauth2/redirect

  webauthn:
    rp-id: localhost
    rp-name: Pulse Test
    origin: http://localhost:3000
    timeout: 60000

management:
  health:
    mail:
      enabled: false
    redis:
      enabled: false