spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://localhost:5433/identity_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: localhost:9092
    admin:
      auto-create: true

  data:
    redis:
      host: localhost
      port: 6379

  mail:
    host: localhost
    port: 1025
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: pulse-identity-dev
          jws-algorithms: HS256
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:google-dev-placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:google-dev-secret}
            redirect-uri: "http://localhost:8081/api/auth/oauth2/callback/google"
          github:
            redirect-uri: "http://localhost:8081/api/auth/oauth2/callback/github"

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    root: INFO
    com.pulse.identity: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.kafka: INFO
    org.flywaydb: DEBUG